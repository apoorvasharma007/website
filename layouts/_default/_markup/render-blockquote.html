{{ if eq .Type "alert" }}
<blockquote class="callout callout-{{ .AlertType }}">
  <p class="callout-title">{{ with .AlertTitle }}{{ . }}{{ else }}{{ .AlertType | humanize }}{{ end }}</p>
  <div class="callout-body">{{ .Text }}</div>
</blockquote>
{{ else }}
<blockquote>{{ .Text }}</blockquote>
{{ end }}
